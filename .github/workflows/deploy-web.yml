name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'env/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy → staging
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Materialise env/.env.staging from secret
        env:
          WEB_ENV_STAGING: ${{ secrets.WEB_ENV_STAGING }}
        run: |
          if [ -z "$WEB_ENV_STAGING" ]; then
            echo "::error::WEB_ENV_STAGING secret is empty or unset"
            exit 1
          fi
          printf '%s\n' "$WEB_ENV_STAGING" > env/.env.staging

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Build and deploy to staging
        run: pnpm deploy:web:staging

  deploy-production:
    name: Deploy → production
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Materialise env/.env.production from secret
        env:
          WEB_ENV_PRODUCTION: ${{ secrets.WEB_ENV_PRODUCTION }}
        run: |
          if [ -z "$WEB_ENV_PRODUCTION" ]; then
            echo "::error::WEB_ENV_PRODUCTION secret is empty or unset"
            exit 1
          fi
          printf '%s\n' "$WEB_ENV_PRODUCTION" > env/.env.production

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Build and deploy to production
        run: pnpm deploy:web:prod
