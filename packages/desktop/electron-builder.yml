appId: com.example.electronapp
productName: ElectronApp
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!src/**'
  - '!*.config.*'
  - '!tsconfig*'
  - '!.eslint*'
  - '!.prettier*'
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
