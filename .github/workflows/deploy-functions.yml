name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'packages/functions/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'supabase/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-functions.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy → staging
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @app/functions typecheck

      - run: pnpm -F @app/functions test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy api function to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}

  deploy-production:
    name: Deploy → production
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @app/functions typecheck

      - run: pnpm -F @app/functions test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy api function to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
